spring.application.name=backend-java

# URL de ligação ao PostgreSQL na Azure
spring.datasource.url=jdbc:postgresql://data-gear.postgres.database.azure.com:5432/postgres?sslmode=require

# Nome de utilizador (Logon do administrador na imagem)
spring.datasource.username=brunopereira

# Palavra-passe definida quando criaste o servidor na Azure
spring.datasource.password=${DB_PASSWORD}

# Driver PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# Configurações do Hibernate / JPA
# Mantém o schema do Azure em estado estável e evita alterações automáticas no banco
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Analytics Python recebe os lotes do upload e calcula os dados do dashboard.
analytics.python.base-url=${ANALYTICS_PYTHON_URL:http://localhost:8000}
analytics.python.api-key=${ETL_API_KEY:}
